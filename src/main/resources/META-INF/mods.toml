modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="${mod_license}"
#issueTrackerURL="https://github.com/SodiumZH/Days-with-Monster-Girls"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://www.curseforge.com/minecraft/mc-mods/befriendmobs-days-with-monster-girls"
#logoFile="examplemod.png" #optional
#credits="SodiumZH" #optional
authors="${mod_authors}" #optional
description="${mod_description}"

[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
    
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
    
[[dependencies.${mod_id}]]
    modId="nffservices"
    mandatory=true
    versionRange="${services_version_range}"
    ordering="NONE"
    side="BOTH"  
    
[[dependencies.${mod_id}]]
    modId="nffgirls"
    mandatory=true
    versionRange="${girls_version_range}"
    ordering="NONE"
    side="BOTH"  
    
[[dependencies.${mod_id}]]
    modId="grimoireofgaia"
    mandatory=true
